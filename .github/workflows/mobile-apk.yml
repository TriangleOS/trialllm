# Builds an installable Android test APK of the mobile app on GitHub's free runners (public repo: no cost).
# No Google Play account, no EAS, no store fees. Pull requests get the APK as a workflow artifact; pushes to
# main also publish it as the "mobile-latest" pre-release so it can be downloaded straight onto a phone.
name: mobile-apk
on:
  pull_request:
    paths: ["mobile/**", "sdk/**", ".github/workflows/mobile-apk.yml"]
  push:
    branches: [main]
    paths: ["mobile/**", "sdk/**", ".github/workflows/mobile-apk.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Public values only: they are compiled into the app.
      EXPO_PUBLIC_TRIANGLE_API_URL: https://llm.triangleos.com
      EXPO_PUBLIC_SUPABASE_URL: https://kvpnvqmgxbqxfwqdrrmm.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_bm-L3FrxW9afbW5DzAOrXQ_1nvuxQ7H
      # Set these repository variables once Triangle LLM v1's GGUF is published; until then the app offers Qwen3 stand-ins.
      EXPO_PUBLIC_TRIANGLE_GGUF_REPO: ${{ vars.TRIANGLE_GGUF_REPO }}
      EXPO_PUBLIC_TRIANGLE_GGUF_FILE: ${{ vars.TRIANGLE_GGUF_FILE }}
      EXPO_PUBLIC_TRIANGLE_GGUF_MB: ${{ vars.TRIANGLE_GGUF_MB }}
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci && npm run build
        working-directory: sdk
      - run: npm ci && npx tsc --noEmit
        working-directory: mobile
      - run: npx expo prebuild --platform android --no-install
        working-directory: mobile
        env: { CI: "1" }
      - run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
        working-directory: mobile/android
      - run: |
          mkdir -p out
          cp mobile/android/app/build/outputs/apk/release/app-release.apk out/triangle-llm-test.apk
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: triangle-llm-test-apk
          path: out/triangle-llm-test.apk
          retention-days: 30

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: triangle-llm-test-apk }
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete mobile-latest --yes --cleanup-tag || true
          gh release create mobile-latest triangle-llm-test.apk --prerelease --target "${{ github.sha }}" \
            --title "Triangle LLM Android test build" \
            --notes "Test build from ${{ github.sha }}. Not from Google Play: Android asks you to allow installs from your browser. Signed with a shared test key, so it is for testing only."
